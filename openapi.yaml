    post:
      operationId: create_topic_reply
      summary: Create Topic Reply
      x-summary-zh: 创建讨论回复
      x-summary-zh-hk: 創建討論回覆
      description: |
        Post a reply to a community topic. Supports nesting under an existing reply. Browse the community on [Topics](https://longbridge.com/topics).

        Only users who have opened a **[Longbridge account](https://longbridge.com/hk/download) and hold assets** are allowed to publish community topics and replies via Longbridge Developers API or CLI. Returns `403` otherwise.

        **Body format:** Plain text only — HTML and Markdown are **not** rendered.

        <TipContainer type="tip">
        Stock symbols mentioned in the body (e.g. `700.HK`, `TSLA.US`) are automatically recognized and linked as related stocks by the platform.

        ⚠️ Do not abuse symbol linking to associate unrelated stocks. Content moderation may restrict publishing or mute the account.
        </TipContainer>

        **Rate limit:** The first 3 replies per user per topic have no wait requirement. After that, each subsequent reply must wait an incrementally longer interval since the previous one:

        | Reply # (after 3rd) | Required wait |
        | ------------------- | ------------- |
        | 4th                 | 3 s           |
        | 5th                 | 5 s           |
        | 6th                 | 8 s           |
        | 7th                 | 13 s          |
        | 8th                 | 21 s          |
        | 9th                 | 34 s          |
        | 10th+               | 55 s (cap)    |

        Exceeding the limit returns `429`.

        > ⚠️ Rate limit thresholds are for reference only and may be adjusted by the platform at any time.
      x-description-zh: |
        在指定讨论下发布回复，支持嵌套回复已有回复。完整社区讨论可访问 [社区](https://longbridge.com/topics)。

        仅限 **[Longbridge 开户](https://longbridge.com/hk/download)且持有资产** 的用户才允许通过 Longbridge Developers 的 API 或 CLI 发布社区讨论和回复。否则返回 `403`。

        **正文格式：** 仅支持纯文本，不支持 HTML 或 Markdown。

        <TipContainer type="tip">
        正文中提到的标的代码（如 `700.HK`、`TSLA.US`）会被平台自动识别并关联为相关标的。

        ⚠️ 请勿滥用此功能关联与内容无关的标的，否则后台内容运营可能会限制发布，甚至有可能禁言。
        </TipContainer>

        **频率限制：** 同一用户在同一讨论下，前 3 条无间隔限制；此后每条须与上一条保持递增间隔（3 s → 5 s → 8 s → 13 s → 21 s → 34 s → 55 s 封顶），超出限制返回 `429`。

        > ⚠️ 以上频率限制规则仅供参考，平台可能随时进行内部调整。
      x-description-zh-hk: |
        在指定討論下發布回覆，支持嵌套回覆已有回覆。完整社區討論可瀏覽 [社區](https://longbridge.com/topics)。

        僅限 **[Longbridge 開戶](https://longbridge.com/hk/download)且持有資產** 的用戶才允許通過 Longbridge Developers 的 API 或 CLI 發布社區討論和回覆。否則返回 `403`。

        **正文格式：** 僅支持純文本，不支持 HTML 或 Markdown。

        <TipContainer type="tip">
        正文中提到的標的代碼（如 `700.HK`、`TSLA.US`）會被平台自動識別並關聯為相關標的。

        ⚠️ 請勿濫用此功能關聯與內容無關的標的，否則後台內容運營可能會限制發布，甚至有可能禁言。
        </TipContainer>

        **頻率限制：** 同一用戶在同一討論下，前 3 條無間隔限制；此後每條須與上一條保持遞增間隔（3 s → 5 s → 8 s → 13 s → 21 s → 34 s → 55 s 封頂），超出限制返回 `429`。

        > ⚠️ 以上頻率限制規則僅供參考，平台可能隨時進行內部調整。
