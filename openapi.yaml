openapi: 3.0.3
info:
  title: Longbridge OpenAPI
  description: |
    Longbridge OpenAPI provides programmatic access to market data, trading, account management,
    watchlist management, and content queries for the Longbridge trading platform.
  version: '1.0.0'
x-pages:
  - id: authentication
    title: Authentication
    x-title-zh: 鉴权
    x-title-zh-hk: 鑑權
    x-icon: lock
    content: |
      Longbridge OpenAPI authenticates every HTTP request with three credentials plus an
      HMAC-SHA256 signature.

      ## Credentials

      | Credential | Description | Where to get it |
      | ---------- | ----------- | --------------- |
      | **App Key** | Public application identifier. Sent as the `X-Api-Key` header. | [OpenAPI console](https://open.longbridge.com/account) |
      | **App Secret** | Private key used only to compute the request signature. **Never sent over the wire.** | OpenAPI console |
      | **Access Token** | Per-user token. Sent as the `Authorization` header. | OpenAPI console (or the token-refresh API) |

      > Prefer an SDK: the Rust/Python/Node.js/Java/C++/Go SDKs compute the signature for you
      > from these three values. The raw-HTTP examples below are for building a client by hand.

      ## Request headers

      Every request carries these headers:

      | Header | Value |
      | ------ | ----- |
      | `Authorization` | `<access_token>` (the access token, not a Bearer token) |
      | `X-Api-Key` | `<app_key>` |
      | `X-Timestamp` | Current unix time in **milliseconds** |
      | `X-Api-Signature` | `HMAC-SHA256 SignedHeaders=authorization;x-api-key;x-timestamp, Signature=<sig>` |

      ## Computing `X-Api-Signature`

      1. Build the signed-headers string:

         ```text
         authorization:<access_token>
         x-api-key:<app_key>
         x-timestamp:<timestamp>
         ```

      2. Build the string to sign (`|`-separated), where `sha1(...)` is a lowercase hex SHA-1
         digest and the trailing body hash is present only when there is a request body:

         ```text
         {METHOD}|{PATH}|{QUERY}|{signed_values}|authorization;x-api-key;x-timestamp|{sha1(body)}
         ```

      3. Sign it:

         ```text
         payload   = "HMAC-SHA256|" + sha1(string_to_sign)
         signature = hex( HMAC_SHA256(payload, App Secret) )
         ```

      4. Send `X-Api-Signature: HMAC-SHA256 SignedHeaders=authorization;x-api-key;x-timestamp, Signature={signature}`.

      ### Reference signing implementation

      Compute the four API-Key headers from your credentials. Other languages follow the same steps.

      [[SIGNING_TABS]]

      > The per-endpoint **Request Example** tabs default to **OAuth 2.0** (`Authorization: Bearer <access_token>`).
      > To use API-Key auth instead, drop the `Authorization: Bearer …` header and add the four signed
      > headers returned by `sign(...)` above.
    x-content-zh: |
      Longbridge OpenAPI 的每个 HTTP 请求都用三项凭证 + 一个 HMAC-SHA256 签名进行鉴权。

      ## 凭证

      | 凭证 | 说明 | 获取方式 |
      | ---- | ---- | -------- |
      | **App Key** | 应用公开标识，作为 `X-Api-Key` 头发送。 | [OpenAPI 控制台](https://open.longbridge.com/account) |
      | **App Secret** | 仅用于计算请求签名的私钥，**不会在网络上传输**。 | OpenAPI 控制台 |
      | **Access Token** | 用户级令牌，作为 `Authorization` 头发送。 | OpenAPI 控制台（或令牌刷新接口） |

      > 建议直接用 SDK：Rust/Python/Node.js/Java/C++/Go SDK 会用这三项凭证自动计算签名。下面的 raw HTTP 示例仅用于手写客户端。

      ## 请求头

      | 头 | 值 |
      | -- | -- |
      | `Authorization` | `<access_token>`（直接是 access token，不是 Bearer token） |
      | `X-Api-Key` | `<app_key>` |
      | `X-Timestamp` | 当前 unix 时间（**毫秒**） |
      | `X-Api-Signature` | `HMAC-SHA256 SignedHeaders=authorization;x-api-key;x-timestamp, Signature=<sig>` |

      ## 计算 `X-Api-Signature`

      1. 构造 signed-values：

         ```text
         authorization:<access_token>
         x-api-key:<app_key>
         x-timestamp:<timestamp>
         ```

      2. 构造待签名字符串（`|` 分隔，`sha1(...)` 为小写十六进制 SHA-1；末尾 body 哈希仅在有请求体时出现）：

         ```text
         {METHOD}|{PATH}|{QUERY}|{signed_values}|authorization;x-api-key;x-timestamp|{sha1(body)}
         ```

      3. 签名：

         ```text
         payload   = "HMAC-SHA256|" + sha1(string_to_sign)
         signature = hex( HMAC_SHA256(payload, App Secret) )
         ```

      4. 发送 `X-Api-Signature: HMAC-SHA256 SignedHeaders=authorization;x-api-key;x-timestamp, Signature={signature}`。

      ### 签名参考实现

      用凭证计算四个 API-Key 头，其他语言遵循相同步骤。

      [[SIGNING_TABS]]

      > 各接口的 **请求示例** 默认用 **OAuth 2.0**（`Authorization: Bearer <access_token>`）。若改用 API Key 鉴权，去掉 `Authorization: Bearer …`，改为附上 `sign(...)` 返回的四个签名头。
    x-content-zh-hk: |
      Longbridge OpenAPI 的每個 HTTP 請求都用三項憑證 + 一個 HMAC-SHA256 簽名進行鑑權。

      ## 憑證

      | 憑證 | 說明 | 獲取方式 |
      | ---- | ---- | -------- |
      | **App Key** | 應用公開標識，作為 `X-Api-Key` 標頭發送。 | [OpenAPI 控制台](https://open.longbridge.com/account) |
      | **App Secret** | 僅用於計算請求簽名的私鑰，**不會在網絡上傳輸**。 | OpenAPI 控制台 |
      | **Access Token** | 用戶級令牌，作為 `Authorization` 標頭發送。 | OpenAPI 控制台（或令牌刷新接口） |

      > 建議直接用 SDK：Rust/Python/Node.js/Java/C++/Go SDK 會用這三項憑證自動計算簽名。下面的 raw HTTP 示例僅用於手寫客戶端。

      ## 請求標頭

      | 標頭 | 值 |
      | -- | -- |
      | `Authorization` | `<access_token>`（直接是 access token，不是 Bearer token） |
      | `X-Api-Key` | `<app_key>` |
      | `X-Timestamp` | 當前 unix 時間（**毫秒**） |
      | `X-Api-Signature` | `HMAC-SHA256 SignedHeaders=authorization;x-api-key;x-timestamp, Signature=<sig>` |

      ## 計算 `X-Api-Signature`

      1. 構造 signed-values：

         ```text
         authorization:<access_token>
         x-api-key:<app_key>
         x-timestamp:<timestamp>
         ```

      2. 構造待簽名字符串（`|` 分隔，`sha1(...)` 為小寫十六進制 SHA-1；末尾 body 哈希僅在有請求體時出現）：

         ```text
         {METHOD}|{PATH}|{QUERY}|{signed_values}|authorization;x-api-key;x-timestamp|{sha1(body)}
         ```

      3. 簽名：

         ```text
         payload   = "HMAC-SHA256|" + sha1(string_to_sign)
         signature = hex( HMAC_SHA256(payload, App Secret) )
         ```

      4. 發送 `X-Api-Signature: HMAC-SHA256 SignedHeaders=authorization;x-api-key;x-timestamp, Signature={signature}`。

      ### 簽名參考實現

      用憑證計算四個 API-Key 標頭，其他語言遵循相同步驟。

      [[SIGNING_TABS]]

      > 各接口的 **請求示例** 預設用 **OAuth 2.0**（`Authorization: Bearer <access_token>`）。若改用 API Key 鑑權，去掉 `Authorization: Bearer …`，改為附上 `sign(...)` 返回的四個簽名標頭。
    x-code-tabs:
      - label: cURL
        lang: Shell
        source: |
          #!/usr/bin/env bash
          # Requires openssl. Fill in APP_KEY / APP_SECRET / ACCESS_TOKEN.
          METHOD="GET"; REQ_PATH="/v1/dailycoins/query"; QUERY=""; BODY=""
          TS="$(date +%s)000"
          SIGNED_HEADERS="authorization;x-api-key;x-timestamp"
          SIGNED_VALUES="authorization:${ACCESS_TOKEN}
          x-api-key:${APP_KEY}
          x-timestamp:${TS}
          "
          CANON="${METHOD}|${REQ_PATH}|${QUERY}|${SIGNED_VALUES}|${SIGNED_HEADERS}|"
          [ -n "$BODY" ] && CANON="${CANON}$(printf %s "$BODY" | openssl dgst -sha1 | awk '{print $2}')"
          PAYLOAD="HMAC-SHA256|$(printf %s "$CANON" | openssl dgst -sha1 | awk '{print $2}')"
          SIG="$(printf %s "$PAYLOAD" | openssl dgst -sha256 -hmac "$APP_SECRET" | awk '{print $2}')"

          curl --request "$METHOD" \
            --url "https://openapi.longbridge.com${REQ_PATH}${QUERY:+?$QUERY}" \
            --header "Authorization: ${ACCESS_TOKEN}" \
            --header "X-Api-Key: ${APP_KEY}" \
            --header "X-Timestamp: ${TS}" \
            --header "X-Api-Signature: HMAC-SHA256 SignedHeaders=${SIGNED_HEADERS}, Signature=${SIG}"
      - label: Python
        lang: Python
        source: |
          import hashlib, hmac, time

          def sign(method, path, query="", body="", *, app_key, app_secret, access_token):
              ts = str(int(time.time() * 1000))
              signed_headers = "authorization;x-api-key;x-timestamp"
              signed_values = f"authorization:{access_token}\nx-api-key:{app_key}\nx-timestamp:{ts}\n"
              canonical = f"{method}|{path}|{query}|{signed_values}|{signed_headers}|"
              if body:
                  canonical += hashlib.sha1(body.encode()).hexdigest()
              payload = "HMAC-SHA256|" + hashlib.sha1(canonical.encode()).hexdigest()
              sig = hmac.new(app_secret.encode(), payload.encode(), hashlib.sha256).hexdigest()
              return {
                  "Authorization": access_token,
                  "X-Api-Key": app_key,
                  "X-Timestamp": ts,
                  "X-Api-Signature": f"HMAC-SHA256 SignedHeaders={signed_headers}, Signature={sig}",
              }
      - label: Node.js
        lang: JavaScript
        source: |
          const crypto = require('crypto')

          function sign(method, path, query = '', body = '', { appKey, appSecret, accessToken }) {
            const ts = String(Date.now())
            const signedHeaders = 'authorization;x-api-key;x-timestamp'
            const signedValues = `authorization:${accessToken}\nx-api-key:${appKey}\nx-timestamp:${ts}\n`
            let canonical = `${method}|${path}|${query}|${signedValues}|${signedHeaders}|`
            if (body) canonical += crypto.createHash('sha1').update(body).digest('hex')
            const payload = 'HMAC-SHA256|' + crypto.createHash('sha1').update(canonical).digest('hex')
            const sig = crypto.createHmac('sha256', appSecret).update(payload).digest('hex')
            return {
              Authorization: accessToken,
              'X-Api-Key': appKey,
              'X-Timestamp': ts,
              'X-Api-Signature': `HMAC-SHA256 SignedHeaders=${signedHeaders}, Signature=${sig}`,
            }
          }
      - label: Java
        lang: Java
        source: |
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.HexFormat;
          import java.util.Map;
          import javax.crypto.Mac;
          import javax.crypto.spec.SecretKeySpec;

          static String sha1Hex(String s) throws Exception {
              byte[] d = MessageDigest.getInstance("SHA-1").digest(s.getBytes(StandardCharsets.UTF_8));
              return HexFormat.of().formatHex(d);
          }

          static Map<String, String> sign(String method, String path, String query, String body,
                                          String appKey, String appSecret, String accessToken) throws Exception {
              String ts = String.valueOf(System.currentTimeMillis());
              String signedHeaders = "authorization;x-api-key;x-timestamp";
              String signedValues = "authorization:" + accessToken + "\nx-api-key:" + appKey + "\nx-timestamp:" + ts + "\n";
              String canonical = method + "|" + path + "|" + query + "|" + signedValues + "|" + signedHeaders + "|";
              if (!body.isEmpty()) canonical += sha1Hex(body);
              String payload = "HMAC-SHA256|" + sha1Hex(canonical);
              Mac mac = Mac.getInstance("HmacSHA256");
              mac.init(new SecretKeySpec(appSecret.getBytes(StandardCharsets.UTF_8), "HmacSHA256"));
              String sig = HexFormat.of().formatHex(mac.doFinal(payload.getBytes(StandardCharsets.UTF_8)));
              return Map.of(
                  "Authorization", accessToken,
                  "X-Api-Key", appKey,
                  "X-Timestamp", ts,
                  "X-Api-Signature", "HMAC-SHA256 SignedHeaders=" + signedHeaders + ", Signature=" + sig);
          }
      - label: Rust
        lang: Rust
        source: |
          use hmac::{Hmac, Mac};
          use sha1::{Digest, Sha1};
          use sha2::Sha256;

          fn sha1_hex(s: &str) -> String {
              format!("{:x}", Sha1::digest(s.as_bytes()))
          }

          fn sign(method: &str, path: &str, query: &str, body: &str,
                  app_key: &str, app_secret: &str, access_token: &str) -> Vec<(String, String)> {
              let ts = std::time::SystemTime::now()
                  .duration_since(std::time::UNIX_EPOCH).unwrap().as_millis().to_string();
              let signed_headers = "authorization;x-api-key;x-timestamp";
              let signed_values = format!("authorization:{access_token}\nx-api-key:{app_key}\nx-timestamp:{ts}\n");
              let mut canonical = format!("{method}|{path}|{query}|{signed_values}|{signed_headers}|");
              if !body.is_empty() {
                  canonical.push_str(&sha1_hex(body));
              }
              let payload = format!("HMAC-SHA256|{}", sha1_hex(&canonical));
              let mut mac = Hmac::<Sha256>::new_from_slice(app_secret.as_bytes()).unwrap();
              mac.update(payload.as_bytes());
              let sig = format!("{:x}", mac.finalize().into_bytes());
              vec![
                  ("Authorization".into(), access_token.into()),
                  ("X-Api-Key".into(), app_key.into()),
                  ("X-Timestamp".into(), ts),
                  ("X-Api-Signature".into(), format!("HMAC-SHA256 SignedHeaders={signed_headers}, Signature={sig}")),
              ]
          }
      - label: C++
        lang: C++
        source: |
          #include <openssl/hmac.h>
          #include <openssl/sha.h>
          #include <string>

          static std::string to_hex(const unsigned char* d, size_t n) {
              static const char* h = "0123456789abcdef";
              std::string s;
              for (size_t i = 0; i < n; i++) { s += h[d[i] >> 4]; s += h[d[i] & 0xf]; }
              return s;
          }
          static std::string sha1_hex(const std::string& s) {
              unsigned char d[SHA_DIGEST_LENGTH];
              SHA1((const unsigned char*)s.data(), s.size(), d);
              return to_hex(d, SHA_DIGEST_LENGTH);
          }

          // ts = current unix time in milliseconds (as a string)
          std::string signature(const std::string& method, const std::string& path, const std::string& query,
                                const std::string& body, const std::string& app_key, const std::string& app_secret,
                                const std::string& access_token, const std::string& ts) {
              std::string signed_headers = "authorization;x-api-key;x-timestamp";
              std::string signed_values =
                  "authorization:" + access_token + "\nx-api-key:" + app_key + "\nx-timestamp:" + ts + "\n";
              std::string canonical =
                  method + "|" + path + "|" + query + "|" + signed_values + "|" + signed_headers + "|";
              if (!body.empty()) canonical += sha1_hex(body);
              std::string payload = "HMAC-SHA256|" + sha1_hex(canonical);
              unsigned char mac[EVP_MAX_MD_SIZE]; unsigned int len = 0;
              HMAC(EVP_sha256(), app_secret.data(), (int)app_secret.size(),
                   (const unsigned char*)payload.data(), payload.size(), mac, &len);
              return "HMAC-SHA256 SignedHeaders=" + signed_headers + ", Signature=" + to_hex(mac, len);
          }
      - label: Go
        lang: Go
        source: "package main\n\nimport (\n\t\"crypto/hmac\"\n\t\"crypto/sha1\"\n\t\"crypto/sha256\"\n\t\"encoding/hex\"\n\t\"fmt\"\n\t\"strconv\"\n\t\"time\"\n)\n\nfunc sign(method, path, query, body, appKey, appSecret, accessToken string) map[string]string {\n\tts := strconv.FormatInt(time.Now().UnixMilli(), 10)\n\tsignedHeaders := \"authorization;x-api-key;x-timestamp\"\n\tsignedValues := fmt.Sprintf(\"authorization:%s\\nx-api-key:%s\\nx-timestamp:%s\\n\", accessToken, appKey, ts)\n\tcanonical := fmt.Sprintf(\"%s|%s|%s|%s|%s|\", method, path, query, signedValues, signedHeaders)\n\tif body != \"\" {\n\t\tbh := sha1.Sum([]byte(body))\n\t\tcanonical += hex.EncodeToString(bh[:])\n\t}\n\tch := sha1.Sum([]byte(canonical))\n\tpayload := \"HMAC-SHA256|\" + hex.EncodeToString(ch[:])\n\tmac := hmac.New(sha256.New, []byte(appSecret))\n\tmac.Write([]byte(payload))\n\tsig := hex.EncodeToString(mac.Sum(nil))\n\treturn map[string]string{\n\t\t\"Authorization\":   accessToken,\n\t\t\"X-Api-Key\":       appKey,\n\t\t\"X-Timestamp\":     ts,\n\t\t\"X-Api-Signature\": fmt.Sprintf(\"HMAC-SHA256 SignedHeaders=%s, Signature=%s\", signedHeaders, sig),\n\t}\n}\n"
  - id: overview
    title: Overview
    x-title-zh: 概览
    x-icon: book
    content: |
      This page is reorganized as a practical **OAuth 2.0 access flow** for new integrations.

      > **Tip:** Prefer using SDKs for faster integration: https://open.longbridge.com/sdk

      ## Notes

      | Precautions                                  | Reference                                                             |
      | -------------------------------------------- | --------------------------------------------------------------------- |
      | Prefer SDKs over raw HTTP when possible      | [SDK Quick Start](/docs/getting-started)                              |
      | Enable required OpenAPI services first       | [How to enable OpenAPI](/docs/#how-to-enable-openapi)                 |
      | Understand permissions and restrictions      | [Permissions and restrictions](/docs/#permissions-and-restrictions)   |
      | Check common error codes for troubleshooting | [Error Codes](/docs/error-codes)                                      |

      ## OAuth 2.0 (Default)

      For new integrations, OAuth 2.0 is the default path.

      API-key signature mode can remain as a fallback for legacy compatibility, but it is not the default.

      ### Discovery endpoints

      - Production: `https://openapi.longbridge.com/.well-known/oauth-authorization-server`
      - China: `https://openapi.longbridge.cn/.well-known/oauth-authorization-server`

      Supported grant types (from discovery):

      - `authorization_code`
      - `refresh_token`

      ## OAuth 2.0 authorization flow

      ### Register OAuth client

      If there is no UI for client creation in your environment, register dynamically:

      ```shell
      curl -X POST https://openapi.longbridge.com/oauth2/register \
        -H "Content-Type: application/json" \
        -d '{
          "client_name": "my-openapi-app",
          "redirect_uris": ["https://your-app.com/callback"],
          "grant_types": ["authorization_code", "refresh_token"],
          "response_types": ["code"]
        }'
      ```

      > Registration may return only `client_id` (public client, no `client_secret`). In this case, use PKCE and do not send `client_secret` in token requests.

      ### Build authorization URL and get `code`

      ```text
      https://openapi.longbridge.com/oauth2/authorize
        ?response_type=code
        &client_id=YOUR_CLIENT_ID
        &redirect_uri=YOUR_REDIRECT_URI
        &scope=3
        &state=YOUR_RANDOM_STATE
        &code_challenge=YOUR_CODE_CHALLENGE
        &code_challenge_method=S256
      ```

      After user consent, callback receives:

      ```text
      YOUR_REDIRECT_URI?code=AUTH_CODE&state=YOUR_RANDOM_STATE
      ```

      ### Exchange `code` for `access_token`

      ```shell
      curl -X POST https://openapi.longbridge.com/oauth2/token \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "grant_type=authorization_code" \
        -d "client_id=YOUR_CLIENT_ID" \
        -d "redirect_uri=YOUR_REDIRECT_URI" \
        -d "code=AUTH_CODE" \
        -d "code_verifier=YOUR_CODE_VERIFIER"
      # only when your client has secret:
      # -d "client_secret=YOUR_CLIENT_SECRET"
      ```

      ### Call API with Bearer token (TSLA.US example)

      ```shell
      curl -X GET "https://openapi.longbridge.com/v1/quote/get_security_list?market=US&category=Overnight" \
        -H "Authorization: Bearer ACCESS_TOKEN"
      ```

      Real response (excerpt, keeping `TSLA.US` row):

      ```json
      {
        "code": 0,
        "message": "success",
        "data": {
          "list": [
            {
              "symbol": "TSLA.US",
              "name_cn": "特斯拉",
              "name_hk": "",
              "name_en": ""
            }
          ]
        }
      }
      ```

      ### Refresh token

      Use OAuth token endpoint for refresh (details in Refresh Token section below):

      ```bash
      curl -X POST https://openapi.longbridge.com/oauth2/token \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "grant_type=refresh_token" \
        -d "client_id=YOUR_CLIENT_ID" \
        -d "refresh_token=REFRESH_TOKEN"
      # only when your client has secret:
      # -d "client_secret=YOUR_CLIENT_SECRET"
      ```

      ## Relationship with legacy docs

      - This page: OAuth 2.0 main flow for new integrations.
      - Refresh Token section below: refresh step details only, to avoid duplication.

      ---

      # Refresh Token (OAuth 2.0)

      This page focuses only on the OAuth 2.0 **refresh token** step.

      - If you have not completed the full flow yet, read the Authentication section above first.
      - This page does not repeat client registration / authorization code steps.

      ## Recommended refresh method (OAuth 2.0)

      Use OAuth token endpoint:

      - `POST https://openapi.longbridge.com/oauth2/token`
      - or China: `POST https://openapi.longbridge.cn/oauth2/token`

      ### Request parameters (`application/x-www-form-urlencoded`)

      | Name | Required | Description |
      | --- | --- | --- |
      | grant_type | Yes | Must be `refresh_token` |
      | client_id | Yes | OAuth client id |
      | refresh_token | Yes | Previously issued refresh token |
      | client_secret | Optional | Required only for confidential clients; omit for public clients |

      ### Refresh example

      ```bash
      curl -X POST https://openapi.longbridge.com/oauth2/token \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "grant_type=refresh_token" \
        -d "client_id=YOUR_CLIENT_ID" \
        -d "refresh_token=YOUR_REFRESH_TOKEN"
      # only when your client has secret:
      # -d "client_secret=YOUR_CLIENT_SECRET"
      ```

      ### Response example

      ```json
      {
        "access_token": "...",
        "refresh_token": "...",
        "expires_in": 2592000,
        "token_type": "Bearer"
      }
      ```

      ## Compatibility note

      Legacy `/v1/token/refresh` remains for backward compatibility.
      For new integrations, use OAuth 2.0 token endpoint as default.
