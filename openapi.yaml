  /v1/gridtrading/submit:
    post:
      operationId: submit_grid_order
      summary: Submit Grid Order
      x-summary-zh: 提交网格订单
      x-summary-zh-hk: 提交網格訂單
      description: |
        Submit a grid strategy order. The grid places buy orders as the price falls and sell
        orders as it rises, within the `[lower_limit_price, upper_limit_price]` band anchored to
        `submitted_base_price`. Before using grid trading you must record the strategy
        risk-disclosure consent once (see `POST /v1/record/questionnaire`).
      x-description-zh: |
        提交网格策略订单。网格在 `[lower_limit_price, upper_limit_price]` 区间内、以
        `submitted_base_price` 为基准，价格下跌时挂买单、上涨时挂卖单。使用网格交易前需先记录一次策略风险揭示确认（见
        `POST /v1/record/questionnaire`）。
      tags:
        - Grid Trading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
                - settlement_currency
                - grid_trading_rule
              properties:
                symbol:
                  type: string
                  description: 'Security symbol in `ticker.region` format (e.g. `700.HK`).'
                settlement_currency:
                  type: string
                  description: Settlement currency (e.g. `HKD`, `USD`).
                grid_trading_rule:
                  $ref: '#/components/schemas/GridTradeRule'
      x-codeSamples:
        - lang: Shell
          label: CLI
          source: |
            longbridge grid submit 700.HK --currency HKD --base-price 300 --upper-price 360 --lower-price 240 --trigger-type percent --trigger-up 2 --trigger-down 2 --quantity 100 --upper-quantity 200 --lower-quantity 100 --order-type GMO --tif gtc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                code: 0
                message: success
                data:
                  order_id: '764609681686573056'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
