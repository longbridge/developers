      tags:
        - Grid Trading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - items
              properties:
                type:
                  type: string
                  description: Questionnaire type. Use `strategy` for grid trading.
                items:
                  type: object
                  description: 'Consent items. For grid trading: `{ "agree": "true" }`.'
                  additionalProperties:
                    type: string
      x-codeSamples:
        - lang: Shell
          label: CLI
          source: |
            longbridge grid questionnaire
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                code: 0
                message: success
                data: {}
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orders/info:
    get:
      operationId: grid_symbol_info
      summary: Grid Symbol Info
      x-summary-zh: 网格标的信息
      x-summary-zh-hk: 網格標的資訊
      description: |
        Query the security info used to build a grid order — name, latest price, board lot sizes,
        price-step (bid-size) rules, and channel / authorization info (whether the strategy consent
        was granted, RTH support, and supported currencies).
      x-description-zh: 查询用于构建网格订单的证券信息——名称、最新价、每手股数、价位（报价步长）规则，以及渠道/授权信息（是否已完成策略确认、是否支持盘前盘后、支持的币种）。
      tags:
        - Grid Trading
      parameters:
