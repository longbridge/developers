      x-summary-zh: 获取历史市场温度
      x-summary-zh-hk: 獲取歷史市場溫度
      description: |
        Get the historical market temperature time series for the specified market within a date range.
        Each data point contains the daily temperature, valuation, and sentiment scores (all scored 0–100).
      x-description-zh: 获取指定市场在日期范围内的历史市场温度时间序列，每个数据点包含当日情绪温度、估值和情绪分项评分（均为 0–100 分制）。
      tags:
        - Market Temperature
      parameters:
        - name: market
          in: query
          required: true
          description: |
            Market code. One of:
            - `HK` — Hong Kong
            - `US` — United States
            - `CN` — A-shares
            - `SG` — Singapore
          schema:
            type: string
        - name: start_date
          in: query
          required: true
          description: Start date in `YYYYMMDD` format (e.g. `20250101`).
          schema:
            type: string
        - name: end_date
          in: query
          required: true
          description: End date in `YYYYMMDD` format (e.g. `20250110`).
          schema:
            type: string
      x-codeSamples:
        - lang: Shell
          label: CLI
          source: |
            longbridge market-temp [MARKET] --history --start YYYY-MM-DD --end YYYY-MM-DD
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                code: 0
                message: success
                data:
                  list:
                    - timestamp: '1735794000'
                      temperature: 58
                      valuation: 54
                      sentiment: 61
                    - timestamp: '1735880400'
                      temperature: 59
