  /v1/gridtrading/detail:
    get:
      operationId: grid_detail
      summary: Grid Order Detail
      x-summary-zh: 网格订单详情
      x-summary-zh-hk: 網格訂單詳情
      description: |
        Query the full detail of a single grid order, including its rule, paged executed sub-orders (`grid_sub_orders`), and paged lifecycle history (`grid_order_history`).
      x-description-zh: |
        查询单个网格订单的完整详情，包括网格规则、分页的成交子订单（`grid_sub_orders`）以及分页的生命周期历史（`grid_order_history`）。
      x-description-zh-hk: |
        查詢單個網格訂單的完整詳情，包括網格規則、分頁的成交子訂單（`grid_sub_orders`）以及分頁的生命週期歷史（`grid_order_history`）。
      tags:
        - Grid
      x-parameters:
        - name: order_id
          in: query
          type: string
          required: true
          description: 'Grid order ID, example: `764609681686573056`'
          x-description-zh: 网格订单 ID，例如：`764609681686573056`
          x-description-zh-hk: 網格訂單 ID，例如：`764609681686573056`
        - name: history_id
          in: query
          type: string
          required: false
          description: Cursor for paging the lifecycle history. Pass the last `history_id` of a page to fetch older entries.
          x-description-zh: 生命周期历史的分页游标，传入某页最后一条的 `history_id` 以获取更早的记录
          x-description-zh-hk: 生命週期歷史的分頁游標，傳入某頁最後一條的 `history_id` 以獲取更早的記錄
        - name: limit
          in: query
          type: integer
          required: false
          description: Page size for `grid_sub_orders` and `grid_order_history`
          x-description-zh: '`grid_sub_orders` 与 `grid_order_history` 的分页大小'
          x-description-zh-hk: '`grid_sub_orders` 與 `grid_order_history` 的分頁大小'
      x-codeSamples:
        - lang: Shell
          label: CLI
          source: |
            # Rule, sub-orders and history of a grid order
            longbridge grid detail 764609681686573056
      x-request-examples:
        - lang: Shell
          label: cURL
          source: |
            curl --request GET \
              --url 'https://openapi.longbridge.com/v1/gridtrading/detail?order_id=<order_id>' \
              --header 'Authorization: Bearer <access_token>'
        - lang: Python
          label: Python
          source: |
            import requests

            resp = requests.get(
                "https://openapi.longbridge.com/v1/gridtrading/detail",
                headers={"Authorization": "Bearer <access_token>"},
                params={"order_id": "<order_id>"},
            )
            print(resp.json())
        - lang: Python
          label: Python (async)
          source: |
            import asyncio
            import aiohttp

            async def main():
                async with aiohttp.ClientSession() as session:
                    async with session.get(
                        "https://openapi.longbridge.com/v1/gridtrading/detail",
                        headers={"Authorization": "Bearer <access_token>"},
                        params={"order_id": "<order_id>"},
                    ) as resp:
                        print(await resp.json())

            asyncio.run(main())
        - lang: JavaScript
          label: Node.js
          source: |
            const url = new URL("https://openapi.longbridge.com/v1/gridtrading/detail")
            url.searchParams.set("order_id", "<order_id>")

            const resp = await fetch(url, {
              method: "GET",
              headers: {
                "Authorization": "Bearer <access_token>",
              },
            })
            console.log(await resp.json())
        - lang: Java
          label: Java
          source: |
            import java.net.URI;
            import java.net.http.*;

            var client = HttpClient.newHttpClient();
            var request = HttpRequest.newBuilder()
                    .uri(URI.create("https://openapi.longbridge.com/v1/gridtrading/detail?order_id=<order_id>"))
                    .header("Authorization", "Bearer <access_token>")
                    .method("GET", HttpRequest.BodyPublishers.noBody())
                    .build();
            var resp = client.send(request, HttpResponse.BodyHandlers.ofString());
            System.out.println(resp.body());
        - lang: Rust
          label: Rust
          source: |
            let client = reqwest::Client::new();
            let resp = client
