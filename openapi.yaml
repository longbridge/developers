      parameters:
        - name: symbol
          in: query
          required: true
          description: 'Security symbol (e.g. `AAPL.US`, `700.HK`).'
          schema:
            type: string
            maxLength: 32
            minLength: 4
            pattern: '^([\w.]*\.[A-Za-z][A-Za-z])$'
        - name: order_type
          in: query
          required: true
          description: |
            Order type. One of:
            `LO` (Limit), `ELO` (Enhanced Limit), `MO` (Market), `LIT` (Limit If Touched),
            `MIT` (Market If Touched), `TSLPAMT` (Trailing Stop Limit by Amount),
            `TSMAMT` (Trailing Stop Market by Amount), `TSMPCT` (Trailing Stop Market by Percent),
            `TSLPPCT` (Trailing Stop Limit by Percent), `AO` (Auction), `ALO` (Auction Limit),
            `ODD` (Odd Lot), `SLO` (Special Limit).
          schema:
            type: string
            enum:
              - LO
              - ELO
              - MO
              - LIT
              - MIT
              - TSLPAMT
              - TSMAMT
              - TSMPCT
              - UnknownOrderType
              - AO
              - ALO
              - ODD
              - TSLPPCT
              - SLO
        - name: side
          in: query
          required: true
          description: Order side. One of `Buy`, `Sell`.
          schema:
            type: string
            enum:
              - UnknownSide
              - Buy
              - Sell
        - name: price
          in: query
          required: false
          description: Limit price. Required for limit order types (e.g. `LO`, `LIT`).
          schema:
            type: string
            nullable: true
        - name: currency
          in: query
          required: false
          description: Settlement currency override (e.g. `USD`, `HKD`).
          schema:
            type: string
            nullable: true
        - name: market
          in: query
          required: false
          description: Market override. One of `US`, `HK`, `SH`, `SZ`, `SG`, `AU`, `JP`, `UK`, `DE`.
          schema:
            type: string
            nullable: true
            enum:
              - UnknownMarket
              - DE
              - JP
              - SH
              - SZ
              - UK
              - AU
              - HK
              - SG
              - US
        - name: fractional_shares
          in: query
          required: false
          description: Whether to allow fractional share quantities in the estimate.
          schema:
            type: boolean
            nullable: true
        - name: order_id
          in: query
          required: false
          description: Original order ID when estimating for an order modification scenario.
          schema:
            type: string
            nullable: true
      x-codeSamples:
        - lang: Shell
          label: CLI
          source: |
            longbridge max-qty <SYMBOL> --side buy --price <PRICE>
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                code: 0
                message: success
                data:
                  cash_max_qty: '0'
                  margin_max_qty: '1859'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
