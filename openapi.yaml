                quantity:
                  type: string
                  nullable: true
                  description: New quantity.
                  pattern: '^([1-9]\d*(\.\d+)?)$'
                price:
                  type: string
                  nullable: true
                  description: New limit price.
                  pattern: '^(0\.\d*[1-9]\d*|[1-9]\d*(\.\d+)?)$'
                trigger_price:
                  type: string
                  nullable: true
