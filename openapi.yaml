  /v1/ai/agents/{agent_id}/conversations/{chat_uid}/messages/{message_id}/continue:
    post:
      operationId: ai_continue
      summary: Continue Conversation
      x-summary-zh: 继续对话
      x-summary-zh-hk: 繼續對話
      description: |
        When [Start Conversation](/docs/ai/chat/conversation) returns `status = interrupted`, the Agent is waiting for more information from you. Send your answers via this endpoint and the paused run resumes from the interrupt point, until it succeeds, gets interrupted again, or fails.

        A single round of conversation may be interrupted multiple times: if the run returns `interrupted` again after continuing, call this endpoint again with the new `interrupt`.

        As with Start Conversation, choose blocking / SSE streaming response mode with the `Accept` header.
      x-description-zh: |
        当 [发起对话](/zh-CN/docs/ai/chat/conversation) 返回 `status = interrupted` 时，Agent 正等待你补充信息。通过本接口回传答案，暂停的运行会从中断处继续执行，直到成功、再次中断或失败。

        同一轮对话可能发生多次中断：若继续后再次返回 `interrupted`，按新的 `interrupt` 重复调用本接口即可。

        与发起对话一致，通过请求头 `Accept` 选择阻塞式 / SSE 流式响应。
      x-description-zh-hk: |
        當 [發起對話](/zh-HK/docs/ai/chat/conversation) 返回 `status = interrupted` 時，Agent 正等待你補充信息。通過本接口回傳答案，暫停的運行會從中斷處繼續執行，直到成功、再次中斷或失敗。

        同一輪對話可能發生多次中斷：若繼續後再次返回 `interrupted`，按新的 `interrupt` 重複調用本接口即可。

        與發起對話一致，通過請求頭 `Accept` 選擇阻塞式 / SSE 流式響應。
