        - lang: Python
          label: Python
          source: |
            import requests

            resp = requests.get(
                "https://openapi.longbridge.com/v1/trade/order/history",
                headers={"Authorization": "Bearer <access_token>"},
            )
            print(resp.json())
        - lang: Python
          label: Python (async)
          source: |
            import asyncio
            import aiohttp

            async def main():
                async with aiohttp.ClientSession() as session:
                    async with session.get(
                        "https://openapi.longbridge.com/v1/trade/order/history",
                        headers={"Authorization": "Bearer <access_token>"},
                    ) as resp:
                        print(await resp.json())

            asyncio.run(main())
        - lang: JavaScript
          label: Node.js
          source: |
            const resp = await fetch("https://openapi.longbridge.com/v1/trade/order/history", {
