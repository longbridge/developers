        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://openapi.longbridge.com/oauth2/authorize
          tokenUrl: https://openapi.longbridge.com/oauth2/token
          scopes:
            openapi: Full OpenAPI access
  schemas:
    GridTradeRule:
      type: object
      description: |
        Grid trading rule — the parameters that define a grid strategy. Prices and quantities are
        decimals transmitted as strings. The gateway validates the minimum required set (base /
        upper / lower price, a trigger spec, quantities, and time in force).
      properties:
        submitted_base_price:
          type: string
          description: Base price the grid is anchored to.
        upper_limit_price:
          type: string
          description: Upper price bound.
        lower_limit_price:
          type: string
          description: Lower price bound.
        trigger_price_type:
          type: integer
          description: 'How trigger thresholds are interpreted: `1` = spread (absolute), `2` = percent.'
          enum:
            - 1
            - 2
        trigger_spread_up:
          type: string
          nullable: true
          description: Upward trigger spread (absolute), when `trigger_price_type` is `1`.
        trigger_spread_down:
          type: string
          nullable: true
          description: Downward trigger spread (absolute), when `trigger_price_type` is `1`.
        trigger_percent_up:
          type: string
          nullable: true
          description: Upward trigger percent, when `trigger_price_type` is `2`.
        trigger_percent_down:
          type: string
          nullable: true
          description: Downward trigger percent, when `trigger_price_type` is `2`.
        multiple_trigger:
          type: boolean
          nullable: true
          description: Whether a single grid level may trigger multiple times.
        time_in_force:
          type: integer
          description: 'Time in force: `0` = Day, `1` = GTC (Good-Til-Canceled), `6` = GTD (Good-Til-Date).'
          enum:
            - 0
            - 1
            - 6
        upper_limit_quantity:
          type: string
          description: Quantity handled when the upper bound is reached.
        lower_limit_quantity:
          type: string
          description: Quantity handled when the lower bound is reached.
        expire_time:
          type: integer
          format: int64
          nullable: true
          description: Expiry time (Unix timestamp, in seconds). Used with a GTD time in force.
        upper_limit_event:
          type: integer
          description: 'Action when the upper bound is reached: `1` = ignore (keep running), `2` = close position at last price.'
          enum:
            - 1
            - 2
        lower_limit_event:
          type: integer
          description: 'Action when the lower bound is reached: `1` = ignore (keep running), `2` = close position at last price.'
          enum:
            - 1
            - 2
        trigger_sell_depth:
          type: integer
          nullable: true
          description: 'Sell-side order-book depth (-5 ~ 5). `0` = use `grid_order_type_up` instead of a depth level.'
        trigger_buy_depth:
          type: integer
          nullable: true
          description: 'Buy-side order-book depth (-5 ~ 5). `0` = use `grid_order_type_down` instead of a depth level.'
        trigger_quantity:
          type: string
          description: Quantity per trigger.
        support_shortsell:
          type: boolean
          nullable: true
          description: Whether short selling is allowed.
        rth:
          type: integer
          nullable: true
          description: 'Regular-trading-hours flag (`0` / `1` / `2`).'
        grid_order_type_up:
          type: string
          nullable: true
          description: 'Sell-side order type when `trigger_sell_depth` is `0`. One of `GMO`, `GLO`, `GTG`.'
        grid_order_type_down:
          type: string
          nullable: true
          description: 'Buy-side order type when `trigger_buy_depth` is `0`. One of `GMO`, `GLO`, `GTG`.'
    Error:
      type: object
      properties:
        code:
          type: integer
          description: Error code.
        message:
          type: string
          description: Error message.
        data:
          nullable: true
          description: Always `null` for error responses.
    Order:
      type: object
      description: Standard order object returned in order list endpoints.
      properties:
        order_id:
          type: string
          nullable: true
          description: Order ID.
        status:
          type: string
          nullable: true
          description: Order status (e.g. `NewStatus`, `FilledStatus`, `CanceledStatus`).
        stock_name:
          type: string
          nullable: true
          description: Security display name.
        quantity:
          type: string
          nullable: true
          description: Ordered quantity.
        executed_quantity:
          type: string
          nullable: true
          description: Filled quantity.
        price:
          type: string
          nullable: true
          description: Limit price (empty for market orders).
        executed_price:
          type: string
          nullable: true
          description: Average fill price.
        submitted_at:
          type: string
          nullable: true
          description: Unix timestamp (seconds) when the order was submitted.
        side:
          type: string
          nullable: true
          description: Order side. One of `Buy`, `Sell`.
        symbol:
          type: string
          nullable: true
          description: Security symbol.
        order_type:
          type: string
          nullable: true
          description: Order type (e.g. `LO`, `MO`, `MIT`).
        last_done:
          type: string
          nullable: true
          description: Last execution price.
        trigger_price:
          type: string
          nullable: true
          description: Trigger price for MIT/LIT orders.
        msg:
          type: string
          nullable: true
          description: Order message or rejection reason.
        tag:
          type: string
          nullable: true
          description: Order tag (e.g. `Normal`, `GTC`).
        time_in_force:
          type: string
          nullable: true
          description: Time-in-force (e.g. `Day`, `GTC`, `GTD`).
        expire_date:
          type: string
          nullable: true
          description: Order expiry date in `YYYY-MM-DD` format (for GTD orders).
        updated_at:
          type: string
          nullable: true
          description: Unix timestamp (seconds) of the last status update.
        trigger_at:
          type: string
          nullable: true
          description: Unix timestamp (seconds) when the trigger condition was met.
        trailing_amount:
          type: string
          nullable: true
          description: Trailing stop amount.
        trailing_percent:
          type: string
          nullable: true
          description: Trailing stop percentage.
        limit_offset:
          type: string
          nullable: true
          description: Limit offset for LIT orders.
        trigger_status:
          type: string
          nullable: true
          description: Trigger status (e.g. `ACTIVE`, `DEACTIVE`, `TRIGGERED`).
        outside_rth:
          type: string
          nullable: true
          description: Extended-hours setting. One of `RTH_ONLY`, `ANY_TIME`, `OVERNIGHT`.
        currency:
          type: string
          nullable: true
          description: Settlement currency.
        remark:
          type: string
          nullable: true
          description: Order remark.
        limit_depth_level:
          type: integer
          nullable: true
          description: Limit depth level (for ELO orders).
        trigger_count:
          type: integer
          nullable: true
          description: Number of times the trigger has fired.
        monitor_price:
          type: string
          nullable: true
          description: Monitor price for conditional orders.
