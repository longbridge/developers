        - lang: Shell
          label: cURL
          source: |
            curl --request POST \
              --url 'https://openapi.longbridge.com/v1/gridtrading/list' \
              --header 'Authorization: Bearer <access_token>' \
              --header 'Content-Type: application/json' \
              --data '{"order_ids":"<order_ids>"}'
        - lang: Python
          label: Python
          source: |
            import requests

            resp = requests.post(
                "https://openapi.longbridge.com/v1/gridtrading/list",
                headers={"Authorization": "Bearer <access_token>", "Content-Type": "application/json"},
                json={"order_ids": "<order_ids>"},
            )
            print(resp.json())
        - lang: Python
          label: Python (async)
          source: |
            import asyncio
            import aiohttp

            async def main():
                async with aiohttp.ClientSession() as session:
                    async with session.post(
                        "https://openapi.longbridge.com/v1/gridtrading/list",
                        headers={"Authorization": "Bearer <access_token>", "Content-Type": "application/json"},
                        json={"order_ids": "<order_ids>"},
                    ) as resp:
                        print(await resp.json())

            asyncio.run(main())
        - lang: JavaScript
          label: Node.js
          source: |
            const resp = await fetch("https://openapi.longbridge.com/v1/gridtrading/list", {
              method: "POST",
              headers: {
                "Authorization": "Bearer <access_token>",
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ order_ids: "<order_ids>" }),
            })
            console.log(await resp.json())
        - lang: Java
          label: Java
          source: |
            import java.net.URI;
            import java.net.http.*;

            var client = HttpClient.newHttpClient();
            var request = HttpRequest.newBuilder()
                    .uri(URI.create("https://openapi.longbridge.com/v1/gridtrading/list"))
                    .header("Authorization", "Bearer <access_token>")
                    .header("Content-Type", "application/json")
                    .method("POST", HttpRequest.BodyPublishers.ofString("{\"order_ids\":\"<order_ids>\"}"))
                    .build();
            var resp = client.send(request, HttpResponse.BodyHandlers.ofString());
            System.out.println(resp.body());
        - lang: Rust
          label: Rust
          source: |
            let client = reqwest::Client::new();
            let resp = client
                    .request(reqwest::Method::POST, "https://openapi.longbridge.com/v1/gridtrading/list")
                    .header("Authorization", "Bearer <access_token>")
                    .json(&serde_json::json!({ "order_ids": "<order_ids>" }))
                    .send()
                    .await?
                    .text()
                    .await?;
            println!("{resp}");
        - lang: C++
          label: C++
          source: |
            #include <curl/curl.h>

            int main() {
                CURL *curl = curl_easy_init();
                struct curl_slist *headers = NULL;
                headers = curl_slist_append(headers, "Authorization: Bearer <access_token>");
                headers = curl_slist_append(headers, "Content-Type: application/json");
                curl_easy_setopt(curl, CURLOPT_URL, "https://openapi.longbridge.com/v1/gridtrading/list");
                curl_easy_setopt(curl, CURLOPT_CUSTOMREQUEST, "POST");
                curl_easy_setopt(curl, CURLOPT_POSTFIELDS, "{\"order_ids\":\"<order_ids>\"}");
                curl_easy_setopt(curl, CURLOPT_HTTPHEADER, headers);
                curl_easy_perform(curl);
                curl_easy_cleanup(curl);
                return 0;
            }
