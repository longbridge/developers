        > **Longbridge US 账户** 此方法仅适用于 Longbridge 美国数据中心账户。

        其他数据中心的账户（如香港、新加坡）**不支持**该方法，即便这些账户可以交易美股；模拟账户（`enable_papertrading = true`）同样**不支持**：**Longbridge US 柜台（US DC）未提供模拟账户功能**，因此整个 US region——所有美股专用接口，而不只是本接口——在模拟环境下均不可用。

        使用不受支持的账户调用时会返回错误，而不是空结果——请勿将该失败理解为“此账户没有委托”。如需模拟环境，请改用 AP 账户与通用交易接口。

        查询美股账户的历史委托和待成交委托，支持分页和筛选。
      x-description-zh-hk: |
        > **Longbridge US 賬戶** 此方法僅適用於 Longbridge 美國數據中心賬戶。

        其他數據中心的賬戶（如香港、新加坡）**不支持**該方法，即便這些賬戶可以交易美股；模擬賬戶（`enable_papertrading = true`）同樣**不支持**：**Longbridge US 櫃檯（US DC）未提供模擬賬戶功能**，因此整個 US region——所有美股專用接口，而不只是本接口——在模擬環境下均不可用。

        使用不受支持的賬戶調用時會返回錯誤，而不是空結果——請勿將該失敗理解為「此賬戶沒有委託」。如需模擬環境，請改用 AP 賬戶與通用交易接口。

        查詢美股賬戶的歷史委託和待成交委託，支持分頁和篩選。
      tags:
        - Trade
      x-parameters:
        - name: symbol
          in: body
          type: string
          required: false
          description: Filter by symbol, e.g. `AAPL.US`
          x-description-zh: 按标的筛选，例如 `AAPL.US`
