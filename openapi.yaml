  /v1/content/topics:
    post:
      operationId: create_topic
      summary: Create Topic
      x-summary-zh: 创建讨论
      x-summary-zh-hk: 創建討論
      description: |
        Create a new community topic on [Topics](https://longbridge.com/topics). Two content types are supported:

        | Type             | `title`      | `body` format   | Notes                                                                                                                  |
        | ---------------- | ------------ | --------------- | ---------------------------------------------------------------------------------------------------------------------- |
        | `post` (default) | Optional     | Plain text only | Markdown syntax (e.g. `**bold**`, `# heading`) is NOT rendered — it appears as literal characters, similar to a tweet. |
        | `article`        | **Required** | Markdown        | The server converts Markdown to HTML for display. Supports headers, tables, bold, code blocks, etc.                    |

        Only users who have opened a **Longbridge account and hold assets** are allowed to publish community topics and replies via Longbridge Developers API or CLI. Returns `403` otherwise.

        <TipContainer type="tip">
        Stock symbols mentioned in the body (e.g. `700.HK`, `TSLA.US`) are automatically recognized and linked as related stocks by the platform. Use `tickers` to associate additional symbols not explicitly mentioned in the body.

        > ⚠️ Do not abuse symbol linking to associate unrelated stocks. Content moderation may restrict publishing or mute the account.
        </TipContainer>

        **Rate limit:** Max 3 topics per user per minute and 10 per 24 hours. Exceeding the limit returns `429`.

        > ⚠️ Rate limit thresholds are for reference only and may be adjusted by the platform at any time.
      x-description-zh: |
        在 [社区](https://longbridge.com/topics)创建一篇新讨论。支持两种内容类型：

        | 类型 | `title` | `body` 格式 | 说明 |
        |------|---------|-------------|------|
        | `post`（默认） | 可选 | 纯文本 | Markdown 语法（如 `**加粗**`、`# 标题`）**不会渲染**，将作为字面字符显示，类似发推文。 |
        | `article` | **必填** | Markdown | 服务端将 Markdown 转为 HTML 展示，支持标题、表格、加粗、代码块等。 |

        仅限 **Longbridge 开户且持有资产** 的用户才允许通过 Longbridge Developers 的 API 或 CLI 发布社区讨论和回复。否则返回 `403`。

        <TipContainer type="tip">
        正文中提到的标的代码（如 `700.HK`、`TSLA.US`）会被平台自动识别并关联为相关标的。`tickers` 字段用于补充正文中未显式提及的标的。

        > ⚠️ 请勿滥用此功能关联与内容无关的标的，否则后台内容运营可能会限制发布，甚至有可能禁言。
        </TipContainer>

        **频率限制：** 同一用户每分钟最多创建 3 篇，24 小时内最多 10 篇，超出返回 `429`。

        > ⚠️ 以上频率限制规则仅供参考，平台可能随时进行内部调整。
      x-description-zh-hk: |
        在 [社區](https://longbridge.com/topics)創建一篇新討論。支持兩種內容類型：

        | 類型 | `title` | `body` 格式 | 說明 |
        |------|---------|-------------|------|
        | `post`（默認） | 可選 | 純文本 | Markdown 語法（如 `**加粗**`、`# 標題`）**不會渲染**，將作為字面字符顯示，類似發推文。 |
        | `article` | **必填** | Markdown | 服務端將 Markdown 轉為 HTML 展示，支持標題、表格、加粗、代碼塊等。 |

        僅限 **Longbridge 開戶且持有資產** 的用戶才允許通過 Longbridge Developers 的 API 或 CLI 發布社區討論和回覆。否則返回 `403`。

        <TipContainer type="tip">
        正文中提到的標的代碼（如 `700.HK`、`TSLA.US`）會被平台自動識別並關聯為相關標的。`tickers` 字段用於補充正文中未顯式提及的標的。

        > ⚠️ 請勿濫用此功能關聯與內容無關的標的，否則後台內容運營可能會限制發布，甚至有可能禁言。
        </TipContainer>

        **頻率限制：** 同一用戶每分鐘最多創建 3 篇，24 小時內最多 10 篇，超出返回 `429`。

        > ⚠️ 以上頻率限制規則僅供參考，平台可能隨時進行內部調整。
