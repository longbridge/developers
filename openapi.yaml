                headers = curl_slist_append(headers, "Authorization: Bearer <access_token>");
                curl_easy_setopt(curl, CURLOPT_URL, "https://openapi.longbridge.com/v1/trade/order/history");
                curl_easy_setopt(curl, CURLOPT_CUSTOMREQUEST, "GET");
