  /v1/ai/agents/{agent_id}/conversations:
    post:
      operationId: ai_conversation
      summary: Start Conversation
      x-summary-zh: 发起对话
      x-summary-zh-hk: 發起對話
      description: |
        Ask a question to the specified Agent. You can start a brand-new conversation, or pass the `chat_uid` of an existing one to continue asking in the same conversation.

        The Agent generates the answer using capabilities such as market data and account access. When the Agent needs more information or confirmation from you, the run is **interrupted** (`status` is `interrupted`) — send your answers via [Continue Conversation](/docs/ai/chat/continue) to resume it.

        Choose the response mode with the `Accept` header: `text/event-stream` streams the run progress and answer via SSE; any other value returns a blocking response with the aggregated final result.
      x-description-zh: |
        向指定 Agent 提问。可以开启一个全新会话，也可以传入已有会话的 `chat_uid` 在同一会话中追加提问。

        Agent 会结合行情、账户等能力生成回答。当 Agent 需要你补充信息或确认时，本次运行会**中断**（`status` 为 `interrupted`），此时需通过 [继续对话](/zh-CN/docs/ai/chat/continue) 回传答案后才能继续。

        通过请求头 `Accept` 选择响应模式：`text/event-stream` 为 SSE 流式，逐步推送运行过程与回答；其他值为阻塞式，一次性返回聚合后的最终结果。
      x-description-zh-hk: |
        向指定 Agent 提問。可以開啟一個全新會話，也可以傳入已有會話的 `chat_uid` 在同一會話中追加提問。

        Agent 會結合行情、賬戶等能力生成回答。當 Agent 需要你補充信息或確認時，本次運行會**中斷**（`status` 為 `interrupted`），此時需通過 [繼續對話](/zh-HK/docs/ai/chat/continue) 回傳答案後才能繼續。

        通過請求頭 `Accept` 選擇響應模式：`text/event-stream` 為 SSE 流式，逐步推送運行過程與回答；其他值為阻塞式，一次性返回聚合後的最終結果。
      tags:
        - AI
      x-request-examples:
        - lang: Shell
          label: cURL
          source: |
            curl --request POST \
              --url 'https://openapi.longbridge.com/v1/ai/agents/{agent_id}/conversations' \
              --header 'Authorization: Bearer <access_token>'
        - lang: Python
          label: Python
          source: |
            import requests

            resp = requests.post(
                "https://openapi.longbridge.com/v1/ai/agents/{agent_id}/conversations",
                headers={"Authorization": "Bearer <access_token>"},
            )
            print(resp.json())
        - lang: Python
          label: Python (async)
          source: |
            import asyncio
            import aiohttp

            async def main():
                async with aiohttp.ClientSession() as session:
                    async with session.post(
                        "https://openapi.longbridge.com/v1/ai/agents/{agent_id}/conversations",
                        headers={"Authorization": "Bearer <access_token>"},
                    ) as resp:
                        print(await resp.json())

            asyncio.run(main())
        - lang: JavaScript
          label: Node.js
          source: |
            const resp = await fetch("https://openapi.longbridge.com/v1/ai/agents/{agent_id}/conversations", {
              method: "POST",
              headers: {
                "Authorization": "Bearer <access_token>",
              },
            })
            console.log(await resp.json())
        - lang: Java
          label: Java
          source: |
            import java.net.URI;
