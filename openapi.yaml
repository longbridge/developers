            curl --request GET \
              --url 'https://openapi.longbridge.com/v1/trade/order/today' \
              --header 'Authorization: Bearer <access_token>'
        - lang: Python
          label: Python
          source: |
            import requests

            resp = requests.get(
                "https://openapi.longbridge.com/v1/trade/order/today",
                headers={"Authorization": "Bearer <access_token>"},
            )
            print(resp.json())
        - lang: Python
          label: Python (async)
          source: |
            import asyncio
            import aiohttp

            async def main():
                async with aiohttp.ClientSession() as session:
                    async with session.get(
                        "https://openapi.longbridge.com/v1/trade/order/today",
                        headers={"Authorization": "Bearer <access_token>"},
                    ) as resp:
                        print(await resp.json())

            asyncio.run(main())
        - lang: JavaScript
          label: Node.js
          source: |
            const resp = await fetch("https://openapi.longbridge.com/v1/trade/order/today", {
              method: "GET",
              headers: {
                "Authorization": "Bearer <access_token>",
              },
            })
            console.log(await resp.json())
        - lang: Java
          label: Java
          source: |
            import java.net.URI;
            import java.net.http.*;

            var client = HttpClient.newHttpClient();
            var request = HttpRequest.newBuilder()
                    .uri(URI.create("https://openapi.longbridge.com/v1/trade/order/today"))
                    .header("Authorization", "Bearer <access_token>")
                    .method("GET", HttpRequest.BodyPublishers.noBody())
                    .build();
            var resp = client.send(request, HttpResponse.BodyHandlers.ofString());
            System.out.println(resp.body());
        - lang: Rust
          label: Rust
          source: |
            let client = reqwest::Client::new();
            let resp = client
                    .request(reqwest::Method::GET, "https://openapi.longbridge.com/v1/trade/order/today")
                    .header("Authorization", "Bearer <access_token>")
                    .send()
                    .await?
                    .text()
                    .await?;
            println!("{resp}");
        - lang: C++
          label: C++
          source: |
            #include <curl/curl.h>

            int main() {
                CURL *curl = curl_easy_init();
                struct curl_slist *headers = NULL;
                headers = curl_slist_append(headers, "Authorization: Bearer <access_token>");
                curl_easy_setopt(curl, CURLOPT_URL, "https://openapi.longbridge.com/v1/trade/order/today");
                curl_easy_setopt(curl, CURLOPT_CUSTOMREQUEST, "GET");
                curl_easy_setopt(curl, CURLOPT_HTTPHEADER, headers);
                curl_easy_perform(curl);
                curl_easy_cleanup(curl);
                return 0;
            }
