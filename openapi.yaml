                  sell_lot_size: '100'
                  bid_sizes:
                    - str_proceed: '0'
                      end_proceed: '500'
                      bid_size: '0.2'
                  channel_info:
                    strategy_granted: true
                    support_rth: true
                    currency: HKD
                    settlement_currency:
                      - HKD
