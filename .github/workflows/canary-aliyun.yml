# Canary 验证 —— 阿里云 CDN + OSS 轨（将来承载 open.longbridge.cn）。
# 把本分支产物发到专用桶 lb-openapi-canary，由 https://open-canary.longbridge.xyz 承载。
# 该域名已 CNAME 到阿里云 CDN（…w.cdngslb.com），私有 Bucket 回源也已验证通过
# （响应头 x-oss-cdn-auth: success）——不是早先以为的「纯 OSS 无 CDN」。
#
# 产物形态：显式设 BUILD_FORMAT=directory。本轨靠 OSS 静态网站托管的
# 「子目录首页 + 文件404规则=Index」让 /foo 直接 200；而 astro.config.ts 的默认值是
# 'file'，那是 Cloudflare Pages 轨需要的形态（用 directory 会把规范 URL 变成带尾斜杠，
# 与 canonical 自相矛盾，见方案 §15.9）。
#
# 刻意不复用 canary.yml：那条的上传目标是 lb-assets/github/canary/... 共享前缀，
# 旧 nginx 取扁平 key 且全链路无 --delete，目录索引产物传进去不会报错，
# 而是让现有站点静默冻结在上一次构建。
#
# ⚠️ 当前阻塞：lb-openapi-canary 的写权限。本流水线用的 AK 属于 RAM 用户
# lb-assets-github（STS GetCallerIdentity 实测），对该桶仍是 AccessDenied——
# 运维已加的授权没有落到这个用户上。
name: Canary · Aliyun CDN + OSS

on:
  push:
    branches:
      - feat/nginx_decommission
    paths-ignore:
      # 只调探针时不要连带触发这条 17 分钟的完整构建
      - '.github/workflows/oss-probe.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OSS_BUCKET: oss://lb-openapi-canary
  OSS_ENDPOINT: oss-cn-hongkong.aliyuncs.com
  SITE_HOSTNAME: https://open-canary.longbridge.xyz

jobs:
  deploy_canary_oss:
    name: build and deploy to lb-openapi-canary
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ossutil
        run: |
          wget -q https://github.com/aliyun/ossutil/releases/download/v1.7.17/ossutil-v1.7.17-linux-amd64.zip
          unzip -q ossutil-v1.7.17-linux-amd64.zip
          cp ./ossutil-v1.7.17-linux-amd64/ossutil ${{github.workspace}}/ossutil
          chmod +x ${{github.workspace}}/ossutil
          ${{github.workspace}}/ossutil --version

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependency
        run: bun install --frozen-lockfile

      - name: Build canary
        run: bun run build:canary
        env:
          # 覆盖 build:canary 的默认站点域名，让 canonical / sitemap / llms.txt
          # 都指向验证域名，验证时点链接不会跳出环境
          VITE_SITE_HOSTNAME: ${{ env.SITE_HOSTNAME }}
          VITE_PORTAL_GATEWAY_BASE_URL: 'https://mr.longbridge.xyz'
          NODE_OPTIONS: --max-old-space-size=14336 --expose-gc
          # 本流水线验证的是 OSS 静态网站托管形态，必须显式要目录索引；
          # astro.config.ts 的默认值是 'file'（供 Cloudflare Pages 轨用）
          BUILD_FORMAT: directory

      - name: Sanity check dist shape
        run: |
          set -e
          echo "--- 目录索引形态抽查 ---"
          test -f dist/index.html                              || { echo "缺 dist/index.html"; exit 1; }
          test -f dist/docs/getting-started/index.html         || { echo "缺 docs/getting-started/index.html（format:directory 未生效？）"; exit 1; }
          test -f dist/longbridge/longbridge-terminal/install  || { echo "缺 longbridge/longbridge-terminal/install"; exit 1; }
          test -d dist/_docs                                   || { echo "缺 _docs/（assets 命名空间未生效？）"; exit 1; }
          echo "--- .md 端点是否仍为扁平文件 ---"
          ls dist/docs/getting-started.md
          echo "--- 不应再有扁平 HTML ---"
          test ! -f dist/docs/getting-started.html || { echo "仍存在扁平 docs/getting-started.html"; exit 1; }
          echo "✓ 产物形态符合预期"

      - name: Upload to Aliyun OSS (lb-openapi-canary)
        env:
          # 优先用按桶授权的专用 AK；没配就回退到现有的 FE_LB_ASSET_*。
          # 后者是配 lb-assets(杭州)用的，对香港的 lb-openapi-canary 有没有写权限取决于
          # 其 RAM 策略是按桶还是账号级——跑一次就知道，失败会是 AccessDenied。
          AK: ${{ secrets.FE_LB_OPENAPI_ACCESS_KEY_ID || secrets.FE_LB_ASSET_ACCESS_KEY_ID }}
          SK: ${{ secrets.FE_LB_OPENAPI_ACCESS_KEY_SECRET || secrets.FE_LB_ASSET_ACCESS_KEY_SECRET }}
          # 只暴露"用了哪一把"，不暴露值；失败时据此判断是凭证没填还是策略没给
          HAS_OPENAPI_AK: ${{ secrets.FE_LB_OPENAPI_ACCESS_KEY_ID != '' && 'yes' || 'no' }}
          CRED_SOURCE: ${{ secrets.FE_LB_OPENAPI_ACCESS_KEY_ID != '' && 'FE_LB_OPENAPI_*' || 'FE_LB_ASSET_*（回退）' }}
        run: |
          set -e
          OSS="${{github.workspace}}/ossutil"
          BASE="-u -r -j 10 -e $OSS_ENDPOINT -i $AK -k $SK"
          echo "--- 凭证来源 ---"
          echo "  FE_LB_OPENAPI_ACCESS_KEY_ID 已配置: $HAS_OPENAPI_AK"
          echo "  本次实际使用: $CRED_SOURCE"
          echo "  AccessKeyId 长度: ${#AK}"

          echo "--- 写权限预检 ---"
          echo ok > /tmp/_probe.txt
          if ! $OSS cp /tmp/_probe.txt $OSS_BUCKET/.ci-probe -f -e $OSS_ENDPOINT -i $AK -k $SK; then
            echo "::error::$CRED_SOURCE 这把 AK 无法写入 $OSS_BUCKET（region: $OSS_ENDPOINT）。"
            if [ "$HAS_OPENAPI_AK" = "no" ]; then
              echo "::error::当前走的是回退凭证。若运维是给另一把 AK（如写 whale-assets 那把）放的权，"
              echo "::error::需要把那把的值填进 Secret FE_LB_OPENAPI_ACCESS_KEY_ID / FE_LB_OPENAPI_ACCESS_KEY_SECRET。"
            else
              echo "::error::已在用专用 AK 仍被拒，说明该 AK 的 RAM 策略里没有本桶，或本桶不属于该 AK 所在账号。"
            fi
            exit 1
          fi
          $OSS rm $OSS_BUCKET/.ci-probe -f -e $OSS_ENDPOINT -i $AK -k $SK || true
          echo "✓ 写权限正常"
          # 桶根即站点根，不带任何前缀
          $OSS cp ./dist/ $OSS_BUCKET/ $BASE --exclude "*.html" --exclude "*.md" --exclude "*.txt" --exclude "*.zip" --meta=Cache-Control:max-age=31536000
          $OSS cp ./dist/ $OSS_BUCKET/ $BASE --include "*.zip" --meta "Cache-Control:no-cache#Content-type:application/zip;charset=utf-8"
          $OSS cp ./dist/ $OSS_BUCKET/ $BASE --include "*.md"  --meta "Cache-Control:no-cache#Content-type:text/markdown;charset=utf-8"
          $OSS cp ./dist/ $OSS_BUCKET/ $BASE --include "*.txt" --meta "Cache-Control:no-cache#Content-type:text/plain;charset=utf-8"
          $OSS cp ./dist/ $OSS_BUCKET/ $BASE --include "*.html" --meta "Cache-Control:no-cache#Content-type:text/html;charset=utf-8"

      - name: Summary
        run: |
          echo "### Canary OSS 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "- 桶: \`lb-openapi-canary\` (hongkong)" >> $GITHUB_STEP_SUMMARY
          echo "- 验证地址: $SITE_HOSTNAME" >> $GITHUB_STEP_SUMMARY
          echo "- commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
